[project]
name = "hondalink-controller"
version = "0.1.0"
description = "FastAPI controller for HondaLink via Android uiautomator2"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "adbutils>=2.12.0",
    "fastapi>=0.128.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic-settings>=2.12.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.20",
    "rich>=14.3.2",
    "tenacity>=9.1.2",
    "typer>=0.21.1",
    "uiautomator2>=3.5.0",
    "uvicorn>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.14",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing"
pythonpath = ["src"]
